<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GIF Gala</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="container">
        <header>
            <h1>🎉 GIF Gala 🎉</h1>
            <h2>Where Memes Come to Life!</h2>
        </header>

        <p>Get ready for a night of laughter, dancing, funny memes,
        and unforgettable moments. Come dressed as your favorite meme!</p>

        <div class="event-details">
            <p><strong>Date:</strong> To be announced</p>
            <p><strong>Time:</strong> To be announced</p>
            <p><strong>Location:</strong> To be announced</p>
        </div>

        <h2>RSVP Now!</h2>

        <p id="message" role="status"></p>

        <form id="rsvp-form">
            <label for="email">Email Address</label>

            <input type="email" id="email" name="email"
            placeholder="Enter your email" required>

            <label for="attendance">Will you attend?</label>

            <select id="attendance" name="attendance" required>
                <option value="">Select an option</option>
                <option value="yes">Yes, I’ll be there</option>
                <option value="no">Sorry, I can’t make it</option>
            </select>

            <button type="submit">Submit</button>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
